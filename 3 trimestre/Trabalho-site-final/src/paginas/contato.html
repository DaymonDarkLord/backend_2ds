<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Lendas da Guitarra</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
    <div class="container nav-container">
        <a href="/" class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <polygon points="11 19 2 12 11 5 11 19"></polygon>
                <polygon points="22 19 13 12 22 5 22 19"></polygon>
            </svg>
            <span>LEGENDARY GUITARS</span>
        </a>

        <nav class="nav-links">
            <a href="/">Início</a>
            <a href="/sobre" class="active">Sobre</a>
            <a href="/servicos">Serviços</a>
            <a href="/contato">Contato</a>
            <a href="/produtos">Produtos</a>
        </nav>
    </div>
</header>


    <main class="container page-content">
        <section class="contact-section">
            <h1>Fale Conosco</h1>
            <p class="subtitle">Tem alguma dúvida sobre história de modelos, deseja solicitar serviços de luthieria ou apenas compartilhar sua paixão por guitarras? Entre em contato.</p>

            <form class="contact-form">
                <div class="form-group">
                    <label for="nome">Seu Nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="email">Seu E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="6" required placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <button type="submit" class="btn">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
        </div>
    </footer>

</body>
</html>
